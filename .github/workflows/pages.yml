# Publishes the built app to GitHub Pages.
#
# A PWA can only be installed from a secure origin — http://192.168.x.x is not
# one, so the service worker never registers and Android offers a plain
# bookmark instead of an app. Pages gives it HTTPS for free.
#
# Nothing here names the account: `base: './'` in vite.config.ts means the same
# build works at a domain root or under /PISO/, so transferring the repo needs
# no change.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
